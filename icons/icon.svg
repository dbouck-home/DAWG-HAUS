<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3140"/><stop offset="1" stop-color="#151920"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb36b"/><stop offset="1" stop-color="#e8873a"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- ground -->
  <rect x="70" y="402" width="372" height="22" rx="11" fill="#3b4352"/>
  <!-- house body -->
  <path d="M120 236 L392 236 L392 404 L120 404 Z" fill="url(#wall)"/>
  <!-- planks -->
  <g stroke="#c96f2a" stroke-width="6" opacity=".55">
    <line x1="120" y1="290" x2="392" y2="290"/><line x1="120" y1="346" x2="392" y2="346"/>
  </g>
  <!-- roof -->
  <path d="M84 254 L256 106 L428 254 L392 278 L256 160 L120 278 Z" fill="#e0353f"/>
  <path d="M84 254 L256 106 L428 254" fill="none" stroke="#a8222b" stroke-width="14" stroke-linejoin="round"/>
  <!-- door -->
  <path d="M206 404 L206 318 A50 50 0 0 1 306 318 L306 404 Z" fill="#1a1d24"/>
  <!-- bone sign -->
  <g transform="translate(256 214)">
    <rect x="-34" y="-8" width="68" height="16" rx="8" fill="#fff6e8"/>
    <circle cx="-34" cy="-9" r="10" fill="#fff6e8"/><circle cx="-34" cy="9" r="10" fill="#fff6e8"/>
    <circle cx="34" cy="-9" r="10" fill="#fff6e8"/><circle cx="34" cy="9" r="10" fill="#fff6e8"/>
  </g>
</svg>
