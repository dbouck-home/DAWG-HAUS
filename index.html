<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAWG HAUS</title>
  <meta name="theme-color" content="#121418">
  <meta name="description" content="DAWG HAUS — a digital audio workstation that runs in your browser.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="topbar">
    <button id="logo" class="brand" title="Woof."><img class="logo-house" src="icons/icon.svg" alt=""><span class="logo-text">DAWG <b>HAUS</b></span></button>
    <div id="project-cover" hidden title="Album cover (change it in Songs)"></div>
    <button id="project-name" class="project-name" title="Rename song">Untitled Song</button>
    <span id="save-status" class="save-status">Saved</span>
    <div class="spacer"></div>
    <button id="btn-undo" class="tb" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button id="btn-redo" class="tb" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
    <button id="btn-projects" class="tb" title="Open, create, import or back up songs">Songs</button>
    <button id="btn-export" class="tb" title="Export the song as a WAV or MP3 file">⤓ Export</button>
    <button id="btn-install" class="tb accent" hidden>Install app</button>
    <button id="btn-tuner" class="tb" title="Chromatic tuner — tune your guitar, bass or voice through the audio input">𝄞 Tuner</button>
    <button id="btn-about" class="tb" title="About DAWG HAUS and sound credits">ⓘ</button>
    <span id="midi-status" class="midi-status" title="Connected MIDI devices">MIDI: …</span>
  </header>

  <div id="transport">
    <div class="group">
      <button id="btn-back" class="tbtn back" title="Undo the last thing you did (Ctrl+Z, or your mouse's back button)">⬅</button>
    </div>
    <div class="group">
      <button id="btn-home" class="tbtn" title="Go to start (Home)">⏮</button>
      <button id="btn-stop" class="tbtn" title="Stop">■</button>
      <button id="btn-play" class="tbtn play" title="Play / Pause (Space)">▶</button>
      <button id="btn-record" class="tbtn rec" title="Record MIDI on the selected track (R)">●</button>
      <button id="btn-countin" class="tbtn toggle small-text" title="Count-in before recording: click to switch between off, 1 bar and 2 bars">Count-in off</button>
      <button id="btn-loop" class="tbtn toggle" title="Loop (drag on the top strip of the ruler to set the loop)">⟲</button>
      <button id="btn-metro" class="tbtn toggle" title="Metronome">♩ Click</button>
    </div>
    <div class="lcd">
      <div class="lcd-main" id="pos-bbt">1.1.000</div>
      <div class="lcd-sub" id="pos-time">0:00.0</div>
    </div>
    <div class="group fields">
      <label class="field" title="Tempo in beats (quarter notes) per minute">
        <span>BPM</span>
        <input id="inp-bpm" type="number" min="20" max="400" step="0.1" value="120">
      </label>
      <button id="btn-tap" class="tbtn small-text" title="Tap tempo: click this in time with the music (4 or more taps)">Tap</button>
      <button id="btn-tempo-lane" class="tbtn toggle small-text" title="Show the tempo lane — add points to speed up or slow down the whole song">Tempo lane</button>
      <button id="btn-tuning" class="tbtn small-text" title="Song tuning: the pitch of A4 for every instrument (440 Hz is standard)">A 440</button>
      <button id="btn-meter" class="meter-btn" title="Time signature at the playhead's bar">4/4</button>
      <label class="field">
        <span>Snap</span>
        <select id="sel-snap"></select>
      </label>
      <label class="field">
        <span>Click</span>
        <select id="sel-click-sound" title="Metronome sound"></select>
        <input id="inp-click-vol" type="range" min="0" max="1" step="0.01" value="0.6" title="Metronome volume">
      </label>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <button id="btn-zoom-out" class="tbtn small" title="Zoom out (Ctrl + scroll)">−</button>
      <button id="btn-zoom-in" class="tbtn small" title="Zoom in (Ctrl + scroll)">+</button>
      <button id="btn-panels" class="tbtn toggle" title="Show / hide the bottom panel (Editor, Instrument, Effects, Mixer, Keyboard)">▤ Panels</button>
      <span class="tab-btns">
      <button id="btn-tab-pianoroll" class="tbtn toggle" title="Piano roll / beat editor (double-click a clip)">Editor</button>
      <button id="btn-tab-instrument" class="tbtn toggle" title="Instrument settings for the selected track">Instrument</button>
      <button id="btn-tab-effects" class="tbtn toggle" title="Effects for the selected track or the master">Effects</button>
      <button id="btn-tab-mixer" class="tbtn toggle" title="Mixer">Mixer</button>
      <button id="btn-tab-keyboard" class="tbtn toggle" title="On-screen keyboard">Keyboard</button>
      <button id="btn-tab-chords" class="tbtn toggle" title="Chord pad (omnichord style) in the song's key">Chords</button>
      </span>
    </div>
  </div>

  <main id="arrange">
    <div id="arrange-inner">
      <div id="corner">
        <button id="btn-add-track" class="add-track">+ Add Track</button>
      </div>
      <div id="ruler"><canvas id="ruler-canvas"></canvas><div id="ruler-playhead" class="playhead-cap"></div></div>
      <div id="track-headers"></div>
      <div id="lanes">
        <canvas id="grid-canvas"></canvas>
        <div id="lane-rows"></div>
        <div id="playhead"></div>
        <div id="empty-hint" class="empty-hint" hidden>No tracks yet — click <b>+ Add Track</b> to start.</div>
      </div>
    </div>
  </main>

  <section id="dock" hidden>
    <div id="dock-resize" title="Drag to resize"></div>
    <div id="dock-tabs" class="dock-tabs"></div>
    <div class="dock-pane" data-pane="pianoroll"><div id="pr-root" class="editor-root"></div><div id="beat-root" class="editor-root" hidden></div></div>
    <div class="dock-pane" data-pane="instrument" id="inst-root"></div>
    <div class="dock-pane" data-pane="effects" id="fx-root"></div>
    <div class="dock-pane" data-pane="mixer"><div id="mixer-strips"></div></div>
    <div class="dock-pane" data-pane="keyboard" id="kb-root"></div>
    <div class="dock-pane" data-pane="chords" id="chord-root"></div>
  </section>

  <footer id="statusbar">
    <span id="status-kb"></span>
    <span class="spacer"></span>
    <span id="status-msg"></span>
  </footer>

  <div id="modal-root"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
